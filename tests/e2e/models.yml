# Local acceptance input for /setup-pstack --file tests/e2e/models.yml.
#
# Selectors are the user's approved mapping, resolved against the authenticated
# model registry at execution time (see the design's "Real separate-OMP
# acceptance run"). This file is acceptance input, NOT a shipped default.
#
# Schema: schemaVersion 1; roles = exactly the 16 scalar roles; panels = exactly
# the 5 panel roles with a non-empty seat list. Choice is
# { type: model, selector: "<provider>/<id>[:level]" } or { type: inherit-parent }.
#
# NOTE (2026-09-04): pinned to provider/models present in the local registry
# snapshot. `cursor/*` has no cached models; opencode-go carries api_key auth.
schemaVersion: 1
autoEnable: true
roles:
  feature: { type: model, selector: opencode-go/glm-5.3-flash }
  refactoring: { type: model, selector: opencode-go/glm-5.3-flash }
  bug-fix: { type: model, selector: opencode-go/deepseek-v4-flash }
  perf-issue: { type: model, selector: opencode-go/deepseek-v4-flash }
  hillclimb: { type: model, selector: opencode-go/glm-5.3 }
  judgment-prose: { type: model, selector: opencode-go/glm-5.3 }
  hardest: { type: model, selector: opencode-go/glm-5.3 }
  how-explorer: { type: model, selector: opencode-go/glm-5.3-flash }
  how-explainer: { type: model, selector: opencode-go/glm-5.3 }
  why-investigator: { type: model, selector: opencode-go/glm-5.3-flash }
  why-synthesizer: { type: model, selector: opencode-go/glm-5.3 }
  reflect-tooling: { type: model, selector: opencode-go/deepseek-v4-flash }
  reflect-judgment: { type: model, selector: opencode-go/glm-5.3 }
  reflect-divergent: { type: model, selector: opencode-go/glm-5.3-flash }
  reflect-synthesizer: { type: model, selector: opencode-go/glm-5.3 }
  swarm-worker: { type: model, selector: opencode-go/glm-5.3-flash }
panels:
  how-critics: &panel
    - { type: model, selector: opencode-go/deepseek-v4-flash-vision-exp:max }
    - { type: model, selector: opencode-go/deepseek-v4-flash }
    - { type: model, selector: opencode-go/glm-5.3-flash }
    - { type: model, selector: opencode-go/glm-5.3 }
  arena-runners: *panel
  arena-cross-judges: *panel
  architect-runners: *panel
  interrogate-reviewers: *panel
